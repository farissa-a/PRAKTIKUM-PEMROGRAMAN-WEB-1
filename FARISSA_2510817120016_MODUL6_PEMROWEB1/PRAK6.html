<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JPhotography</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <style>
    body {
      font-family: Georgia, serif;
      color: #333;
    }

    .navbar {
      background-color: #fff;
      border-bottom: 1px solid #ddd;
      border-radius: 0;
      margin-bottom: 0;
    }
    .navbar-brand {
      font-weight: bold;
      font-size: 20px;
      color: #333 !important;
      letter-spacing: 1px;
    }
    .navbar-nav > li > a {
      color: #333 !important;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding-top: 20px;
      padding-bottom: 20px;
    }
    .navbar-nav > li > a:hover,
    .navbar-nav > li.active > a {
      color: #000 !important;
      background-color: transparent !important;
      font-weight: bold;
    }

    .hero-section {
      text-align: center;
      padding: 50px 15px 30px;
    }
    .hero-section h2 {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 5px;
    }
    .hero-section h3 {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .hero-section p.subtitle {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #999;
    }

    .filter-section {
      text-align: center;
      margin: 20px 0 25px;
    }
    .filter-section .btn {
      border-radius: 20px;
      font-size: 12px;
      padding: 5px 16px;
      margin: 2px;
      border: 1px solid #ccc;
      background-color: #fff;
      color: #333;
    }
    .filter-section .btn.active,
    .filter-section .btn:focus {
      background-color: #fff;
      color: #333;
      border-color: #999;
      outline: none;
      box-shadow: none;
    }

    .gallery-section {
      padding: 0 15px 40px;
    }
    .gallery-section .row {
      margin: 0 -3px;
    }
    .gallery-section [class*="col-"] {
      padding: 3px;
    }
    .gallery-section img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
      filter: grayscale(30%);
      transition: filter 0.3s ease;
    }
    .gallery-section img:hover {
      filter: grayscale(0%);
    }

    .img-placeholder {
      width: 100%;
      height: 180px;
      background-color: #bbb;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 12px;
    }

    footer {
      text-align: center;
      padding: 30px 15px;
      border-top: 1px solid #eee;
    }
    footer .brand-name {
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }
    footer .copyright {
      font-size: 11px;
      color: #999;
      margin-bottom: 12px;
    }
    footer .social-icons a {
      color: #555;
      font-size: 16px;
      margin: 0 5px;
      text-decoration: none;
    }
    footer .social-icons a:hover {
      color: #000;
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-default">
    <div class="container">
      <div class="navbar-header">
        <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#navMenu">
          <span class="icon-bar"></span>
          <span class="icon-bar"></span>
          <span class="icon-bar"></span>
        </button>
        <a class="navbar-brand" href="#">JPhotography</a>
      </div>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="nav navbar-nav navbar-right">
          <li class="active"><a href="#">Home</a></li>
          <li><a href="#">About Me</a></li>
          <li><a href="#">Portfolio</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="hero-section">

    <p class="subtitle">Award Winning Photographer / Cinematographer / Writer</p>
  </div>

    <button class="btn active">All</button>
    <button class="btn">Landscape</button>
    <button class="btn">Portrait</button>

</body>
